<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body>
    <header id="top">
        <!--Navigation-->
        <a href="../AltSchool Assignment/index.html">Home</a>
        <a href="./">Application Form</a>

        <h1>Application Form</h1>
        <p>Fields marked * are required</p>
        
    </header>

    <main>
        <form action="#" method="post">
        <fieldset>
          <legend>Personal Information</legend>

          <p>
            <label for="first-name">First name *</label><br />
            <input type="text" id="first-name" name="firstName" required />
          </p>

          <p>
            <label for="last-name">Last name *</label><br />
            <input type="text" id="last-name" name="lastName" required />
          </p>

          <p>
            <label for="email">Email address *</label><br />
            <input type="email" id="email" name="email" required />
          </p>

          <p>
            <label for="phone">Phone number *</label><br />
            <input type="tel" id="phone" name="phone" required />
          </p>

          <p>
            <label for="country">Country *</label><br />
            <select id="country" name="country" required>
              <option value="">Select a country</option>
              <option value="nigeria">Nigeria</option>
            </select>
          </p>
        </fieldset>

        <fieldset>
          <legend>Program Details</legend>

          <p>
            <label for="track">Preferred track *</label><br />
            <select id="track" name="track" required>
              <option value="">Select a track</option>
              <option value="fullstack">AI Full Stack Engineering</option>
            </select>
          </p>

          <fieldset>
            <legend>Current status *</legend>
            <input type="radio" id="student" name="status" value="student" required />
            <label for="student">Student</label>

            <input type="radio" id="employed" name="status" value="employed" />
            <label for="employed">Employed</label>

            <input type="radio" id="unemployed" name="status" value="unemployed" />
            <label for="unemployed">Unemployed</label>
          </fieldset>

          <p>
            <label for="motivation">Why do you want to join? *</label><br />
            <textarea id="motivation" name="motivation" rows="5" cols="40" required></textarea>
          </p>
        </fieldset>

        <p>
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the terms and conditions *</label>
        </p>

        <button type="submit">Submit application</button>
      </form>
    </main>

    <footer><p><small>&copy; 2026 Franklyn Chukwuebuka Mbonu</small></p></footer>
    


</body>
</html>
